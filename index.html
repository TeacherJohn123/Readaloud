<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國小高年級朗讀斷句與句型拆解訓練</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{colors:{brand:{50:'#f0f9ff',100:'#e0f2fe',500:'#0284c7',600:'#0369a1'}}}}}
</script>
<style>
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;background:#f8fafc}
.slot-btn{transition:transform .15s}.slot-btn:hover{transform:scale(1.15)}
</style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">
<header class="bg-white border-b sticky top-0 z-50 shadow-sm">
  <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center gap-2 flex-wrap">
    <h1 class="text-lg md:text-xl font-bold">📖 朗讀斷句與句型拆解大師</h1>
    <nav class="flex gap-1" role="tablist">
      <button role="tab" data-tab="library" class="tab px-3 py-2 rounded-lg text-sm">句型實例庫</button>
      <button role="tab" data-tab="practice" class="tab px-3 py-2 rounded-lg text-sm">標記練習 (30句)</button>
      <button role="tab" data-tab="record" class="tab px-3 py-2 rounded-lg text-sm">錄音檢核</button>
    </nav>
  </div>
</header>
 
<main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">
  <section id="sec-library" class="space-y-5">
    <div class="bg-gradient-to-r from-brand-600 to-indigo-600 rounded-2xl p-6 text-white shadow">
      <h2 class="text-xl font-bold mb-2">💡 為什麼朗讀要學會「斷句」？</h2>
      <p class="text-sm md:text-base leading-relaxed">斷句不是看到標點才停，而是依據<b>語意結構與畫面感</b>呼吸與微停。正確的斷句能讓聽眾輕鬆理解文章情感。</p>
      <div class="mt-3 flex flex-wrap gap-2 text-xs font-medium">
        <span class="bg-white/20 px-3 py-1 rounded-full"><b class="text-amber-300">/</b> 微停半拍（不換氣）</span>
        <span class="bg-white/20 px-3 py-1 rounded-full"><b class="text-red-300">//</b> 大停頓（換氣）</span>
        <span class="bg-white/20 px-3 py-1 rounded-full"><b class="text-yellow-300">▲</b> 重音關鍵字</span>
      </div>
    </div>
    <div id="cat-tabs" class="flex flex-wrap gap-2"></div>
    <div id="examples" class="grid gap-5"></div>
  </section>
 
  <section id="sec-practice" class="hidden">
    <div class="bg-white rounded-2xl p-6 border shadow-sm space-y-5">
      <div class="flex flex-wrap justify-between items-center gap-3">
        <div>
          <h2 class="text-xl font-bold">互動斷句標記大挑戰 (共30句)</h2>
          <p class="text-xs text-slate-500">點擊字詞間的「＋」，依序切換 <b class="text-brand-600">/</b>、<b class="text-red-500">//</b>、清除。</p>
        </div>
        <div class="bg-slate-50 px-4 py-2 rounded-xl border text-center">
          <span class="text-xs text-slate-400 block">累積得分</span>
          <span id="score" class="font-bold text-brand-600">0 分</span>
        </div>
      </div>
      <div id="p-select" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto p-1 border rounded-xl bg-slate-50"></div>
      <div class="bg-slate-50 rounded-xl p-5 border">
        <div class="flex justify-between items-center">
          <span id="p-tag" class="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-indigo-100 text-indigo-700"></span>
          <button id="p-listen" class="text-xs text-brand-600 bg-white px-3 py-1 rounded-lg border shadow-sm">🔊 聆聽標準原聲</button>
        </div>
        <div id="p-box" class="my-5 py-4 px-3 bg-white rounded-xl border flex flex-wrap items-center gap-y-3 text-lg sm:text-2xl font-medium leading-relaxed"></div>
        <div class="flex flex-wrap gap-3 justify-end">
          <button id="p-reset" class="px-4 py-2 rounded-xl border text-slate-600 hover:bg-slate-100 text-sm">↺ 重置標記</button>
          <button id="p-check" class="px-6 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-bold">✔ 檢查答案</button>
        </div>
      </div>
      <div id="p-feedback" class="hidden rounded-xl p-5 border" aria-live="polite"></div>
    </div>
  </section>
 
  <section id="sec-record" class="hidden">
    <div class="bg-white rounded-2xl p-6 border shadow-sm space-y-5">
      <div>
        <h2 class="text-xl font-bold">朗讀停頓自我檢核台</h2>
        <p class="text-xs text-slate-500">照著標記朗讀並錄音，再聽聽停頓是否自然。（錄音需使用 https 或 localhost）</p>
      </div>
      <select id="r-select" class="w-full sm:w-auto px-4 py-2 border rounded-xl font-medium"></select>
      <div id="r-script" class="bg-slate-50 rounded-xl p-6 border text-xl md:text-2xl font-bold leading-relaxed"></div>
      <div class="bg-slate-900 rounded-2xl p-5 text-white flex flex-col md:flex-row items-center justify-between gap-5">
        <div class="flex items-center gap-4">
          <button id="r-btn" class="w-16 h-16 rounded-full bg-red-500 hover:bg-red-600 text-2xl active:scale-95 transition" aria-label="開始或停止錄音">🎙</button>
          <div><div id="r-status" class="font-bold">準備就緒</div><div id="r-timer" class="text-2xl font-mono text-slate-400">00:00</div></div>
        </div>
        <div class="w-full md:flex-1 max-w-md bg-slate-800 p-3 rounded-xl">
          <span class="text-xs text-slate-400">我的錄音回放：</span>
          <audio id="r-audio" controls class="w-full h-8 mt-1"></audio>
        </div>
      </div>
      <div class="grid md:grid-cols-3 gap-4 border-t pt-5" id="r-checks"></div>
    </div>
  </section>
</main>
 
<footer class="bg-white border-t py-4 text-center text-xs text-slate-400">國小高年級國語朗讀教學輔助系統 &copy; 2026</footer>

DB.forEach((q,i)=>{q.id="q"+i;q.raw=q.slots.join("").replace(/▲/g,"")});
 
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stressHtml=s=>esc(s).replace(/▲/g,'<span class="text-amber-500 font-black">▲</span>');
const markHtml=m=>m==="//"?'<span class="text-red-500 font-black mx-1.5">//</span>':m==="/"?'<span class="text-brand-500 font-black mx-1">/</span>':'';
const marked=q=>q.slots.map((s,i)=>stressHtml(s)+markHtml(q.ans[i]||"")).join("");
 
let solved=new Set();
try{solved=new Set(JSON.parse(localStorage.getItem("reading_solved")||"[]"))}catch(e){}
const saveSolved=()=>{try{localStorage.setItem("reading_solved",JSON.stringify([...solved]))}catch(e){}};
const renderScore=()=>{$("score").textContent=solved.size*10+" 分"};
 
function switchTab(name){
  ["library","practice","record"].forEach(t=>$("sec-"+t).classList.toggle("hidden",t!==name));
  document.querySelectorAll(".tab").forEach(b=>{
    const on=b.dataset.tab===name;
    b.setAttribute("aria-selected",on);
    b.className="tab px-3 py-2 rounded-lg text-sm "+(on?"bg-brand-50 text-brand-600 font-semibold":"text-slate-600 hover:bg-slate-100");
  });
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
 
function speak(text){
  if(!("speechSynthesis" in window)){alert("您的瀏覽器不支援語音合成功能！");return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="zh-TW";u.rate=0.85;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-")==="zh-TW");
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
 
let cat="all";
function renderCats(){
  const btn=(k,l,n)=>`<button data-k="${k}" class="px-3 py-1.5 rounded-lg text-xs font-bold ${cat===k?"bg-brand-500 text-white":"bg-slate-100 text-slate-600 hover:bg-slate-200"}">${l} (${n})</button>`;
  $("cat-tabs").innerHTML=btn("all","全部",DB.length)+Object.keys(CATS).map(k=>btn(k,CATS[k],DB.filter(q=>q.c===k).length)).join("");
  $("cat-tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.k;renderCats();renderExamples()});
}
function renderExamples(){
  const list=DB.map((q,i)=>[q,i]).filter(([q])=>cat==="all"||q.c===cat);
  $("examples").innerHTML=list.map(([q,i])=>`
  <article class="bg-white rounded-2xl p-5 border shadow-sm space-y-3">
    <div class="flex justify-between items-center">
      <span class="text-xs font-bold px-3 py-1 rounded-full bg-brand-50 text-brand-600">${CATS[q.c]} (第 ${i+1} 題)</span>
      <button data-s="${i}" class="speak text-xs text-slate-500 bg-slate-50 px-2.5 py-1 rounded-md border">🔊 聆聽朗讀</button>
    </div>
    <div class="text-xl md:text-2xl font-bold leading-relaxed bg-slate-50 p-4 rounded-xl">${marked(q)}</div>
    <div class="bg-indigo-50/60 rounded-xl p-4 border border-indigo-100 text-sm grid md:grid-cols-2 gap-1.5">
      ${q.st.map(([k,v])=>`<div><b class="text-indigo-700">${esc(k)}：</b>${esc(v)}</div>`).join("")}
    </div>
    <div class="bg-red-50/60 rounded-xl p-4 border border-red-100 space-y-1">
      <div class="text-xs font-bold text-red-600">⚠ 常見錯誤斷句：</div>
      <p class="text-sm line-through decoration-red-400">${esc(q.wrong)}</p>
      <p class="text-xs text-red-700/80"><b>盲點剖析：</b>${esc(q.why)}</p>
    </div>
  </article>`).join("");
  document.querySelectorAll(".speak").forEach(b=>b.onclick=()=>speak(DB[b.dataset.s].raw));
}
 
let cur=0,marks=[],checked=false;
function renderSelector(){
  $("p-select").innerHTML=DB.map((q,i)=>`<button data-i="${i}" class="w-9 h-9 rounded-lg text-xs font-bold ${i===cur?"bg-brand-500 text-white":solved.has(q.id)?"bg-emerald-100 text-emerald-700":"bg-slate-100 text-slate-600 hover:bg-slate-200"}">${i+1}</button>`).join("");
  $("p-select").querySelectorAll("button").forEach(b=>b.onclick=()=>loadQ(+b.dataset.i));
}
function loadQ(i){
  cur=i;checked=false;marks=new Array(DB[i].slots.length-1).fill("");
  $("p-tag").textContent=`第 ${i+1} 題 - ${CATS[DB[i].c]}`;
  $("p-feedback").classList.add("hidden");
  renderSelector();renderBox();
}
function renderBox(){
  const q=DB[cur];
  $("p-box").innerHTML=q.slots.map((s,i)=>{
    let h=`<span>${esc(s.replace(/▲/g,""))}</span>`;
    if(i<marks.length){
      const m=marks[i],bad=checked&&m!==q.ans[i];
      const cls=m==="/"?"bg-brand-50 text-brand-600 border-brand-500":m==="//"?"bg-red-50 text-red-500 border-red-400":"bg-slate-100 text-slate-400 border-dashed border-slate-300";
      h+=`<button data-i="${i}" aria-label="第${i+1}個停頓位置" class="slot-btn mx-1 px-2.5 py-0.5 rounded-md border text-sm font-black ${cls} ${bad?"ring-2 ring-amber-500":""} ${checked&&!bad?"ring-2 ring-emerald-400":""}">${m||"＋"}</button>`;
    }
    return h;
  }).join("");
  $("p-box").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;marks[i]=marks[i]===""?"/":marks[i]==="/"?"//":"";
    checked=false;$("p-feedback").classList.add("hidden");renderBox();
  });
}
function checkAnswer(){
  const q=DB[cur];checked=true;
  const wrong=q.ans.map((a,i)=>marks[i]!==a).filter(Boolean).length;
  renderBox();
  const f=$("p-feedback");f.classList.remove("hidden");
  const next=cur<DB.length-1?`<button id="p-next" class="mt-3 px-4 py-2 rounded-lg bg-brand-500 text-white text-sm font-bold">下一題 →</button>`:"";
  if(!wrong){
    const first=!solved.has(q.id);
    if(first){solved.add(q.id);saveSolved();renderScore();renderSelector()}
    f.className="rounded-xl p-5 border bg-emerald-50 border-emerald-200 text-emerald-900";
    f.innerHTML=`<div class="font-bold text-lg text-emerald-700 mb-1">🎉 標記完全正確！${first?"＋10 分":"（本題已得過分）"}</div>
      <div class="text-sm bg-white/80 p-3 rounded-lg font-medium">${CATS[q.c]}：${marked(q)}</div>${next}`;
  }else{
    f.className="rounded-xl p-5 border bg-amber-50 border-amber-200 text-amber-900";
    f.innerHTML=`<div class="font-bold text-lg text-amber-800 mb-1">還有 ${wrong} 處不同（橘框為需修正、綠框為正確）</div>
      <div class="text-base font-bold bg-white p-3 rounded-lg border border-amber-200 mb-2">${marked(q)}</div>
      <p class="text-xs"><b>提示：</b>先找出核心動作，動作前的修飾成分不要太早切斷。</p>${next}`;
  }
  if($("p-next"))$("p-next").onclick=()=>loadQ(cur+1);
}
$("p-reset").onclick=()=>loadQ(cur);
$("p-check").onclick=checkAnswer;
$("p-listen").onclick=()=>speak(DB[cur].raw);
 
let rec=null,chunks=[],recording=false,timer=null,secs=0,audioUrl=null;
function renderScript(){$("r-script").innerHTML=marked(DB[+$("r-select").value])}
async function toggleRec(){
  if(!recording){
    if(!navigator.mediaDevices||!window.MediaRecorder){alert("此瀏覽器不支援錄音功能。");return}
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mime=["audio/webm","audio/mp4"].find(t=>MediaRecorder.isTypeSupported(t));
      rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];
      rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
      rec.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());
        if(audioUrl)URL.revokeObjectURL(audioUrl);
        audioUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));
        $("r-audio").src=audioUrl;
      };
      rec.start();recording=true;setRecUI(true);
      secs=0;$("r-timer").textContent="00:00";
      timer=setInterval(()=>{secs++;$("r-timer").textContent=String(secs/60|0).padStart(2,"0")+":"+String(secs%60).padStart(2,"0")},1000);
    }catch(e){alert("無法存取麥克風，請確認已授權。")}
  }else{
    rec.stop();recording=false;clearInterval(timer);setRecUI(false);
  }
}
function setRecUI(on){
  $("r-btn").textContent=on?"■":"🎙";
  $("r-btn").className="w-16 h-16 rounded-full text-2xl active:scale-95 transition "+(on?"bg-slate-600 animate-pulse":"bg-red-500 hover:bg-red-600");
  $("r-status").textContent=on?"錄音中…":"準備就緒";
}
$("r-btn").onclick=toggleRec;
$("r-select").innerHTML=DB.map((q,i)=>`<option value="${i}">例句 ${i+1}：${esc(q.raw.slice(0,16))}…</option>`).join("");
$("r-select").onchange=renderScript;
$("r-checks").innerHTML=[["1. 「/」處是否停頓半拍？","有，非常順暢","稍顯太快"],["2. 「//」處是否平穩換氣？","氣息充足","差點斷氣"],["3. 重音關鍵字是否強調？","有讀出感情","稍微平淡"]]

 <div class="flex gap-4 text-xs text-slate-600">${[a,b].map(l=>`<label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="c${i}"> ${l}</label>`).join("")}</div></div>`).join("");
